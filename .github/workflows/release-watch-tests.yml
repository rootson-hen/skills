name: Release watch safety tests
on:
  push:
    branches: [personal]
    paths: ['skills/in-progress/release-watch/**', '.github/workflows/release-watch-tests.yml']
  pull_request:
    paths: ['skills/in-progress/release-watch/**', '.github/workflows/release-watch-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -I -m unittest discover -s skills/in-progress/release-watch -p 'test_*.py' -v
